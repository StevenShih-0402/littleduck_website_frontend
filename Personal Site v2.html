<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小鴨ㄉ創作湖畔 v2 · 小屋 + 後台</title>
<meta name="description" content="個人小屋：部落格 × 作品展示 × 後台管理原型" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* ── theme tokens: day = MAG(雜誌/紙) · night = TERM(終端機) ── */
  :root {
    --bg:    #f5f1e8;
    --paper: #fbf8ef;
    --card:  #fbf8ef;
    --ink:   #0e0e0c;
    --line:  #0e0e0c;
    --soft:  rgba(14,14,12,.18);
    --dim:   #5a564e;
    --acc:   #1e6c93;
    --acc2:  #c25a3a;
    --heavy: 5px;
    --radius: 0px;
    --acc-contrast: #fbf8ef;
  }
  html.night {
    --bg:    #0d1614;
    --paper: #11201b;
    --card:  #152922;
    --ink:   #d7ecdd;
    --line:  #1d3c33;
    --soft:  #1d3c33;
    --dim:   #6e8a7b;
    --acc:   #6ddca5;
    --acc2:  #ffe79a;
    --heavy: 1px;
    --radius: 6px;
    --acc-contrast: #0d1614;
  }
  /* 全站等比例放大：最小字級 9.5px → 12px（12 / 9.5 ≈ 1.263） */
  html { zoom: 1.263; }
  html, body { background: var(--bg); color: var(--ink); }
  body, .theme-fade { transition: background-color .35s ease, color .35s ease, border-color .35s ease; }

  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .sans { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
  .ntc  { font-family: 'Noto Sans TC', 'Inter', sans-serif; }
  .ntcs { font-family: 'Noto Serif TC', 'Crimson Pro', serif; }
  .serif{ font-family: 'Crimson Pro', 'Noto Serif TC', Georgia, serif; }

  .v-bg    { background: var(--bg); }
  .v-paper { background: var(--paper); }
  .v-card  { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .v-line  { border-color: var(--line); }
  .v-soft  { border-color: var(--soft); }
  .v-ink   { color: var(--ink); }
  .v-dim   { color: var(--dim); }
  .v-acc   { color: var(--acc); }
  .v-acc2  { color: var(--acc2); }
  .v-acc-bg{ background: var(--acc); color: var(--acc-contrast); }
  .rule-heavy { border-top-width: var(--heavy); border-color: var(--line); }
  .rad { border-radius: var(--radius); }

  /* image placeholder (thumbnail) — adapts to theme */
  .ph {
    background:
      linear-gradient(135deg, color-mix(in srgb, var(--ink) 7%, transparent) 25%, transparent 25%, transparent 50%,
        color-mix(in srgb, var(--ink) 7%, transparent) 50%, color-mix(in srgb, var(--ink) 7%, transparent) 75%, transparent 75%) 0 0 / 14px 14px,
      var(--paper);
    border: 1px solid var(--line);
    color: var(--dim);
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    border-radius: var(--radius);
  }

  ::selection { background: var(--acc); color: var(--acc-contrast); }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  .tap { min-height: 44px; }
  @keyframes blink { 50% { opacity: 0; } }
  .cursor { display:inline-block; width:.55em; height:1em; background:var(--acc); vertical-align:-.12em; margin-left:.18em; animation: blink 1.05s steps(1) infinite; }

  .hover-rule { position: relative; }
  .hover-rule::after {
    content: ""; position: absolute; left:0; bottom:-2px; height:2px; width:100%;
    background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .25s ease;
  }
  .hover-rule:hover::after { transform: scaleX(1); }

  /* markdown body */
  .md { line-height: 1.95; font-size: 14.5px; }
  .md h2 { font-weight: 900; font-size: 22px; margin: 1.4em 0 .5em; letter-spacing: -.01em; }
  .md h3 { font-weight: 700; font-size: 17px; margin: 1.2em 0 .4em; }
  .md p  { margin: .7em 0; }
  .md ul { list-style: none; padding-left: .2em; margin: .7em 0; }
  .md ul li { padding-left: 1.2em; position: relative; }
  .md ul li::before { content: "—"; position: absolute; left: 0; color: var(--acc); font-weight: 900; }
  .md blockquote { border-left: 3px solid var(--acc); padding: .2em 0 .2em 1em; color: var(--dim); font-family: 'Noto Serif TC', serif; margin: .9em 0; }
  .md code { font-family: 'JetBrains Mono', monospace; font-size: .88em; background: color-mix(in srgb, var(--ink) 8%, transparent); padding: .1em .35em; border-radius: 3px; }
  .md a { color: var(--acc); text-decoration: underline; }
  .md hr { border: 0; border-top: 1px solid var(--soft); margin: 1.4em 0; }
  .md strong { font-weight: 900; }

  /* form controls (front + admin) */
  .inp {
    width: 100%; background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 9px 12px; font-size: 13.5px; outline: none;
  }
  .inp:focus { border-color: var(--acc); box-shadow: 0 0 0 2px color-mix(in srgb, var(--acc) 25%, transparent); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px 16px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    background: var(--paper); color: var(--ink); min-height: 40px;
    transition: transform .08s ease, background .15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-acc { background: var(--acc); color: var(--acc-contrast); border-color: var(--acc); }

  /* ── admin skins ── */
  .adm { min-height: 100vh; }
  .adm-neutral {
    --a-bg: #f2f3f5; --a-panel: #ffffff; --a-line: #e2e4e9; --a-ink: #1a1d23;
    --a-dim: #6b7280; --a-acc: #2a6fdb; --a-acc-c: #ffffff; --a-rad: 10px;
    font-family: 'Inter', 'Noto Sans TC', sans-serif;
  }
  .adm-day {
    --a-bg: #f5f1e8; --a-panel: #fbf8ef; --a-line: #0e0e0c; --a-ink: #0e0e0c;
    --a-dim: #5a564e; --a-acc: #1e6c93; --a-acc-c: #fbf8ef; --a-rad: 0px;
    font-family: 'Noto Sans TC', 'Inter', sans-serif;
  }
  .adm-night {
    --a-bg: #0d1614; --a-panel: #11201b; --a-line: #1d3c33; --a-ink: #d7ecdd;
    --a-dim: #6e8a7b; --a-acc: #6ddca5; --a-acc-c: #0d1614; --a-rad: 6px;
    font-family: 'JetBrains Mono', 'Noto Sans TC', monospace;
  }
  .adm { background: var(--a-bg); color: var(--a-ink); }
  .a-panel { background: var(--a-panel); border: 1px solid var(--a-line); border-radius: var(--a-rad); }
  .a-line { border-color: var(--a-line); }
  .a-dim { color: var(--a-dim); }
  .a-acc { color: var(--a-acc); }
  .a-acc-bg { background: var(--a-acc); color: var(--a-acc-c); }
  .a-inp {
    width: 100%; background: var(--a-panel); color: var(--a-ink);
    border: 1px solid var(--a-line); border-radius: var(--a-rad);
    padding: 9px 12px; font-size: 13.5px; outline: none;
  }
  .a-inp:focus { border-color: var(--a-acc); box-shadow: 0 0 0 2px color-mix(in srgb, var(--a-acc) 25%, transparent); }
  .a-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--a-line); border-radius: var(--a-rad);
    padding: 7px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    background: var(--a-panel); color: var(--a-ink); min-height: 38px;
  }
  .a-btn-acc { background: var(--a-acc); color: var(--a-acc-c); border-color: var(--a-acc); }
</style>
</head>
<body class="sans">
<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</body>
